name: Security checks
on:
  workflow_call:
    inputs:
      dependency_audit:
        type: boolean
        default: true
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      dependency_audit:
        description: Query public dependency advisories
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install "torch>=2.1,<3" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt -r requirements-security.txt
      - run: python scripts/security_scan.py
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m compileall -q app tests scripts
      - name: Dependency audit and version-specific VEX validation
        if: github.event_name == 'schedule' || inputs.dependency_audit == true
        shell: bash
        run: |
          mkdir -p security-scan-results
          audit_status=0
          python -m pip_audit --format json --output security-scan-results/pip-audit.json || audit_status=$?
          if [ "$audit_status" -gt 1 ]; then exit "$audit_status"; fi
          # No global ignores. The complete report must pass the explicit VEX policy.
          python scripts/security_scan.py --audit-json security-scan-results/pip-audit.json
