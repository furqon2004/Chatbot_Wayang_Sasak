name: Security checks
on:
  pull_request:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      dependency_audit:
        description: Query public dependency advisories
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/security_scan.py
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m compileall -q app tests scripts
      - name: Dependency audit and version-specific VEX validation
        if: github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dependency_audit == true)
        shell: bash
        run: |
          python -m pip install -r requirements-security.txt
          python -m pip check
          mkdir -p security-scan-results
          audit_status=0
          python -m pip_audit --format json --output security-scan-results/pip-audit.json || audit_status=$?
          if [ "$audit_status" -gt 1 ]; then exit "$audit_status"; fi
          # No global ignores. The complete report must pass the explicit VEX policy.
          python scripts/security_scan.py --audit-json security-scan-results/pip-audit.json
